# Words shown under each photo in `assets/media/gallery/`.
# Key is the image filename. Photos with no entry render without text.
#
# Short form — a single line of text:
#
#   10-perovskite.jpg: "Green photoluminescence from a lead halide perovskite"
#
# Long form — a heading plus a sentence or two:
#
#   20-terahertz.jpg:
#     title: "Terahertz generation"
#     text: >
#       Intense terahertz fields are generated by optical rectification of
#       near-infrared laser pulses in a LiNbO3 prism; the accompanying
#       second-harmonic generation results in strong purple emission.
#
# Markdown works in both fields.

